
name: PAUS Supabase Keepalive

on:
  schedule:
    - cron: '17 1,9,17 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail-with-body --retry 3 \
            "$URL/rest/v1/keepalive?select=id&limit=1" \
            -H "apikey: $KEY"
